<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>占卜系統｜塔羅牌 ✦ 易經卦象</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
:root{
  --ink:#14101c;--bg:#eee7f4;--gold:#b8923a;--gold-lt:#e8d5a0;--gold-pale:#faf6eb;
  --jade:#2a5e50;--jade-lt:#e4f0ec;--rust:#7d3520;--mist:#6b7280;--border:#d8c9e8;--card:#fffdf9;
  --purple:#5a3d7a;--purple-lt:#ece4f2;--tarot:#4a2d6b;--iching:#8a5a2a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
header{background:var(--ink);padding:18px 20px;display:flex;align-items:center;gap:12px;}
.logo{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;width:36px;height:36px;padding:4px;border:1.5px solid var(--gold);}
.logo span{background:var(--gold);opacity:.5;}
.logo span:nth-child(5){opacity:1;}
header h1{font-family:'Noto Serif TC',serif;color:var(--gold);font-size:1.05rem;letter-spacing:.1em;}
header p{color:rgba(255,255,255,.4);font-size:.68rem;margin-top:2px;}
.tab-bar{background:var(--ink);display:flex;border-top:1px solid rgba(255,255,255,.08);}
.nav-a{flex:1;text-align:center;padding:10px;color:rgba(255,255,255,.5);cursor:pointer;border-bottom:2px solid transparent;font-size:.85rem;}
.nav-a.on{color:var(--gold);border-bottom-color:var(--gold);}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 80px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--tarot),var(--iching));}
.card-title{font-family:'Noto Serif TC',serif;font-size:.95rem;font-weight:700;color:var(--ink);margin-bottom:14px;letter-spacing:.06em;}
.field label{display:block;font-size:.72rem;color:var(--mist);margin-bottom:4px;}
.field select,.field input,.field textarea{width:100%;border:1px solid var(--border);background:var(--bg);padding:9px 10px;font-family:'Noto Sans TC',sans-serif;font-size:.88rem;color:var(--ink);border-radius:4px;outline:none;}
.field textarea{resize:none;min-height:70px;line-height:1.7;}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--gold);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.btn{width:100%;padding:13px;background:var(--ink);color:var(--gold);border:none;border-radius:4px;font-family:'Noto Serif TC',serif;font-size:1rem;font-weight:700;letter-spacing:.1em;cursor:pointer;margin-top:10px;}
.btn:hover{background:#2a1f38;}

/* 選擇入口 */
.method-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.method-card{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:24px 14px;text-align:center;cursor:pointer;transition:all .15s;}
.method-card:active{transform:scale(.97);}
.method-card.tarot{border-color:var(--tarot);}
.method-card.iching{border-color:var(--iching);}
.method-card .mc-icon{font-size:2.2rem;margin-bottom:8px;}
.method-card .mc-title{font-family:'Noto Serif TC',serif;font-weight:700;font-size:1rem;margin-bottom:4px;}
.method-card.tarot .mc-title{color:var(--tarot);}
.method-card.iching .mc-title{color:var(--iching);}
.method-card .mc-desc{font-size:.72rem;color:var(--mist);}

/* 快速問題標籤 */
.quick-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.qtag{padding:6px 12px;border:1px solid var(--border);border-radius:20px;font-size:.78rem;cursor:pointer;background:var(--bg);color:var(--ink);}
.qtag.sel{background:var(--purple);border-color:var(--purple);color:#fff;}

/* 牌陣選擇 */
.spread-opt{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.spread-btn{flex:1;min-width:100px;padding:12px 8px;border:1.5px solid var(--border);border-radius:6px;text-align:center;cursor:pointer;background:var(--card);font-size:.8rem;}
.spread-btn.sel{border-color:var(--tarot);background:var(--purple-lt);color:var(--tarot);font-weight:700;}

/* 塔羅牌卡片 */
.tarot-card{background:linear-gradient(160deg,#2a1a3d 0%,var(--tarot) 100%);border:2px solid var(--gold-lt);border-radius:10px;padding:16px;margin-bottom:12px;color:#fff;}
.tarot-card.reversed .tc-name::after{content:' (逆位)';color:#ff9d8a;font-size:.75em;}
.tc-pos{font-size:.72rem;color:var(--gold-lt);margin-bottom:6px;letter-spacing:.05em;}
.tc-name{font-family:'Noto Serif TC',serif;font-size:1.15rem;font-weight:700;margin-bottom:8px;color:#fff;}
.tc-keywords{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.tc-kw{background:rgba(255,255,255,.15);padding:3px 10px;border-radius:12px;font-size:.7rem;}
.tc-meaning{font-size:.86rem;line-height:1.85;color:rgba(255,255,255,.92);}

/* 易經爻線 */
.hexagram-lines{display:flex;flex-direction:column-reverse;gap:8px;margin:16px 0;align-items:center;}
.yao-line{display:flex;align-items:center;gap:12px;width:100%;max-width:280px;}
.yao-visual{flex-shrink:0;width:100px;height:14px;position:relative;}
.yao-visual .bar{position:absolute;top:0;height:14px;background:var(--iching);border-radius:2px;}
.yao-visual .bar.left{left:0;}
.yao-visual .bar.right{right:0;}
.yao-label{font-size:.72rem;color:var(--mist);flex-shrink:0;width:50px;}
.yao-moving{color:var(--rust);font-weight:700;font-size:.78rem;}

.sec{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:18px;margin-bottom:12px;}
.sec-head{font-family:'Noto Serif TC',serif;font-size:.9rem;font-weight:700;color:var(--purple);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.sec-icon{width:22px;height:22px;background:var(--purple);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;flex-shrink:0;}
.sec-body{font-size:.86rem;line-height:1.95;color:#2a200e;}
.sec-body p{margin-bottom:8px;}
.hl{font-weight:700;color:var(--purple);}
.gold{font-weight:700;color:var(--gold);}
.tip{background:var(--purple-lt);border-left:3px solid var(--purple);padding:10px 14px;border-radius:0 4px 4px 0;margin-top:10px;font-size:.84rem;line-height:1.8;}

.export-bar{background:var(--ink);border-radius:6px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.export-bar p{color:rgba(255,255,255,.6);font-size:.82rem;}
.ebtn{background:var(--gold);color:var(--ink);border:none;padding:9px 16px;border-radius:4px;font-size:.8rem;font-weight:700;cursor:pointer;}
.backbtn{background:transparent;border:1px solid var(--border);color:var(--mist);padding:7px 14px;border-radius:4px;font-size:.8rem;cursor:pointer;margin-bottom:12px;}
</style>
</head>
<body>
<header>
  <div class="logo"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div><h1>占卜系統</h1><p>塔羅牌 ✦ 易經銅錢卦</p></div>
</header>
<div class="tab-bar">
  <a onclick="goNav('divine',this)" class="nav-a on">🔮 占卜</a>
  <a onclick="goNav('crm',this)" class="nav-a">👤 客戶管理</a>
</div>
<div class="wrap">

<div id="divine-view">

<!-- 入口選擇 -->
<div id="method-select">
  <div class="card">
    <div class="card-title">選擇占卜方式</div>
    <div class="method-grid">
      <div class="method-card tarot" onclick="chooseMethod('tarot')">
        <div class="mc-icon">🃏</div>
        <div class="mc-title">塔羅牌</div>
        <div class="mc-desc">78張牌義<br>抽牌看指引</div>
      </div>
      <div class="method-card iching" onclick="chooseMethod('iching')">
        <div class="mc-icon">☯️</div>
        <div class="mc-title">易經銅錢卦</div>
        <div class="mc-desc">擲卦六次<br>看卦象變化</div>
      </div>
    </div>
  </div>
</div>

<!-- 問題輸入區（塔羅/易經共用） -->
<div id="question-input" style="display:none">
  <button class="backbtn" onclick="backToMethod()">← 返回選擇方式</button>
  <div class="card">
    <div class="card-title" id="qi-title">輸入問卜資料</div>
    <div class="row2">
      <div class="field"><label>姓名（可留白）</label><input type="text" id="q-name" placeholder="問卜者姓名"></div>
      <div class="field"><label>今天日期</label><input type="text" id="q-date" readonly></div>
    </div>
    <div class="field" style="margin-bottom:12px">
      <label>想問什麼？</label>
      <div class="quick-tags" id="quick-tags"></div>
      <textarea id="q-question" placeholder="或直接輸入你想問的具體問題，例如：我跟他還有機會嗎？這份工作我該接受嗎？"></textarea>
    </div>

    <div id="tarot-spread-area" style="display:none">
      <div class="field"><label>選擇牌陣</label></div>
      <div class="spread-opt" id="spread-opt"></div>
    </div>

    <button class="btn" id="start-btn" onclick="startDivination()">✦ 開始占卜</button>
  </div>
</div>

<!-- 結果顯示區 -->
<div id="result-view" style="display:none">
  <div class="export-bar">
    <p id="r-title">占卜結果</p>
    <div style="display:flex;gap:8px">
      <button class="ebtn" onclick="copyResult()">📋 複製結果</button>
      <button class="ebtn" onclick="window.print()">🖨 列印</button>
    </div>
  </div>
  <button class="backbtn" onclick="backToMethod()">← 再占卜一次</button>
  <div id="result-content"></div>
</div>

</div><!-- /divine-view -->

<div id="crm-view" style="display:none">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div class="card-title" style="margin-bottom:0">客戶管理</div>
      <button onclick="openAddClient()" style="background:var(--jade);color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:.85rem;">＋ 新增客戶</button>
    </div>
    <p style="font-size:.78rem;color:var(--mist);margin-bottom:14px;">與紫微、八字、靈數命盤系統共用同一份客戶資料</p>
    <div id="client-list"></div>
  </div>
</div>

<div id="client-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:8px;padding:24px;width:90%;max-width:480px;max-height:90vh;overflow-y:auto;">
    <h2 id="modal-title" style="font-family:'Noto Serif TC',serif;font-size:1rem;font-weight:700;margin-bottom:16px;">新增客戶</h2>
    <div class="row2">
      <div class="field"><label>姓名</label><input type="text" id="c-name"></div>
      <div class="field"><label>電話</label><input type="text" id="c-phone" placeholder="0912..."></div>
    </div>
    <div class="row2">
      <div class="field"><label>出生年</label><input type="number" id="c-year" placeholder="1985"></div>
      <div class="field"><label>備注</label><input type="text" id="c-note" placeholder="過敏、偏好、注意事項…"></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
      <button onclick="closeModal()" style="padding:9px 20px;border-radius:4px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.85rem;">取消</button>
      <button onclick="saveClient()" style="padding:9px 20px;border-radius:4px;border:none;background:var(--jade);color:#fff;cursor:pointer;font-size:.85rem;font-weight:700;">儲存</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
// 塔羅牌資料庫：22張大阿爾克那 + 56張小阿爾克那 = 78張
// ══════════════════════════════════════════════════════════
var TAROT_MAJOR=[
  {name:'愚人 The Fool',kw:['新開始','冒險','天真'],up:'你正站在一段全新旅程的起點，帶著初生之犢的勇氣，不需要看清所有的路才能邁出第一步。這張牌鼓勵你相信直覺，勇敢地跳，過程中的風景比你想像中安全。',rev:'逆位的愚人提醒你，衝動行事前先想清楚，太過天真或不顧後果的冒進，可能會讓你錯過重要的細節。先停一下，再往前走。'},
  {name:'魔術師 The Magician',kw:['創造力','行動力','掌握資源'],up:'你手上已經握有所有需要的資源和能力，現在是把想法化為行動的時候。這張牌代表你有足夠的力量去創造你想要的結果，關鍵是開始做，而不是繼續想。',rev:'逆位提醒你可能在操弄手段或缺乏誠信，也可能是能力和自信心不足，導致計畫遲遲無法落地。誠實面對自己真正的意圖。'},
  {name:'女祭司 The High Priestess',kw:['直覺','潛意識','神秘'],up:'答案不在外面，而在你的內心深處。這張牌要你相信自己的直覺和內在的聲音，現在不是急著行動的時候，而是安靜下來聆聽的時候。',rev:'逆位代表你可能忽略了自己的直覺，或是被表面的資訊迷惑而看不清真相，也可能有秘密或隱瞞的事情需要被揭露。'},
  {name:'皇后 The Empress',kw:['豐盛','母性','創造'],up:'豐盛與滋養的能量正圍繞著你，無論是感情、事業或創意，都處在一個成長茁壯的階段。這張牌鼓勵你享受當下的豐足，也提醒你去滋養身邊重要的人事物。',rev:'逆位可能代表過度依賴他人、缺乏自我照顧，或是創造力受阻。也可能暗示在關係中付出與獲得失衡。'},
  {name:'皇帝 The Emperor',kw:['權威','結構','穩定'],up:'這張牌代表秩序、結構和掌控力。現在是建立穩固基礎、展現領導力的時候，用理性和紀律去達成你的目標，你有能力成為自己人生的主導者。',rev:'逆位提醒你可能過度控制或濫用權威，也可能是缺乏自律和方向感，讓事情失去掌控。'},
  {name:'教皇 The Hierophant',kw:['傳統','信仰','指導'],up:'這張牌代表傳統智慧、體制內的學習，或尋求一位導師的指引。現在適合遵循既有的規範和經驗，從傳統的方法中找到答案。',rev:'逆位代表對傳統框架的反叛，或是質疑既有的信仰體系，也可能是墨守成規反而阻礙了你的成長。'},
  {name:'戀人 The Lovers',kw:['愛情','選擇','和諧'],up:'這張牌代表深刻的連結與和諧的關係，也可能代表一個重要的抉擇正擺在你面前。跟隨你內心真正的價值觀去做選擇，這個選擇會反映你是誰。',rev:'逆位代表關係中的失衡、價值觀的衝突，或是難以做出承諾。也可能暗示一段關係正面臨考驗。'},
  {name:'戰車 The Chariot',kw:['意志力','勝利','前進'],up:'憑藉強大的意志力和專注，你正朝著目標穩健前進，即使過程中有相互拉扯的力量，你都有能力駕馭並取得勝利。保持專注，成功就在前方。',rev:'逆位代表方向感的迷失、內在衝突讓你無法前進，或是過於強硬導致阻力增加，需要重新調整方向。'},
  {name:'力量 Strength',kw:['內在力量','溫柔的堅韌','勇氣'],up:'真正的力量不是蠻力，而是溫柔而堅定的內在韌性。這張牌代表你有能力用耐心和愛去克服眼前的挑戰，不需要用強硬的方式證明自己。',rev:'逆位代表自我懷疑、缺乏信心，或是用了錯誤的方式（過度強硬或過度壓抑）去面對困難。'},
  {name:'隱士 The Hermit',kw:['內省','獨處','智慧'],up:'現在是往內探尋、遠離喧囂的時刻。這張牌鼓勵你花時間獨處反思，你需要的答案來自內在的智慧，而不是外界的聲音。',rev:'逆位代表過度的孤立讓你與世界脫節，或是逃避面對問題，也可能是該走出來尋求連結的時候了。'},
  {name:'命運之輪 Wheel of Fortune',kw:['變化','機運','循環'],up:'人生的循環正在轉動，一個重要的轉折點即將到來。這張牌提醒你，命運帶來的機會需要被把握，順應變化的流動，好運正在靠近。',rev:'逆位代表運勢的低潮或計畫外的阻礙，也可能是抗拒改變讓你錯過機會，學會臣服於變化的規律。'},
  {name:'正義 Justice',kw:['公平','真相','因果'],up:'這張牌代表公平、真相與因果的法則。你先前的選擇和行動，現在會得到相應的結果。保持誠實與公正，事情會朝正確的方向發展。',rev:'逆位代表不公平的對待、逃避責任，或是決策上的偏頗，也可能暗示法律或合約糾紛需要留意。'},
  {name:'倒吊人 The Hanged Man',kw:['暫停','犧牲','換角度看'],up:'現在不是行動的時候，而是換一個角度看事情的時候。這張牌代表暫時的停滯或犧牲，能帶來意想不到的新視野和覺悟。',rev:'逆位代表無謂的犧牲、抗拒改變視角，或是停滯不前讓你感到挫折，是時候放下執著繼續前進。'},
  {name:'死神 Death',kw:['結束','轉變','重生'],up:'這張牌很少代表真正的死亡，而是象徵一個階段的結束和另一個新開始的誕生。放下不再適合你的事物，才能迎接蛻變後的自己。',rev:'逆位代表抗拒必要的改變、緊抓著已經結束的事物不放，這樣的執著只會讓轉變的過程更加痛苦。'},
  {name:'節制 Temperance',kw:['平衡','調和','耐心'],up:'這張牌代表耐心、調和與中庸之道。現在適合把兩個看似對立的事物找到平衡點，穩健而不急躁地整合資源，會帶來意想不到的和諧。',rev:'逆位代表失衡、過度或不足，缺乏耐心導致的衝突，需要重新找回生活或關係中的平衡點。'},
  {name:'惡魔 The Devil',kw:['束縛','慾望','陰影'],up:'這張牌揭示了讓你感到被困住的執念、慾望或負面模式。認清這些束縛你的鎖鏈，你會發現其實一直都有能力掙脫它們。',rev:'逆位代表開始意識到並掙脫這些束縛的過程，是釋放和解脫的開始，代表你正在打破舊有的負面循環。'},
  {name:'高塔 The Tower',kw:['劇變','覺醒','崩塌重建'],up:'這張牌代表突如其來的劇變，可能會讓建立已久的結構瞬間崩塌。雖然過程震撼，但這往往是清除虛假基礎、迎向真實的必要過程。',rev:'逆位代表對即將到來的變化的抗拒，或是劇變的影響被延緩但終究無法避免，也可能代表從過去的崩塌中逐漸復原。'},

function buildMinorDeck(){
  var deck=[];
  SUITS.forEach(function(suit){
    for(var i=1;i<=10;i++){
      deck.push({
        name:suit.name+NUM_NAMES[i-1],
        kw:[suit.element+'元素',i<=3?'開端':i<=7?'發展':'完成'],
        up:MINOR_NUM_MEANING[suit.key][i-1],
        rev:'逆位時，'+MINOR_NUM_MEANING[suit.key][i-1].split('，')[0]+'的能量受到阻礙或延遲，需要更留意內在的調整，或是這份能量正以較為內化、隱藏的方式在運作。'
      });
    }
    COURT_NAMES.forEach(function(court){
      deck.push({
        name:suit.name+court.n,
        kw:[suit.element+'元素',court.d],
        up:'這張宮廷牌代表一位具備'+suit.theme+'特質的人物，或是你自己正展現出'+court.d+'的能量。留意生活中符合這個角色特質的人事物，他們可能帶來重要的訊息。',
        rev:'逆位代表這股'+court.d+'的能量被誤用或壓抑，也可能提醒你留意某個人不成熟或不誠實的一面，或是你自己需要調整展現這股能量的方式。'
      });
    });
  });
  return deck;
}

var currentMethod=null;
var selectedSpread=null;

}

function startDivination(){
  var question=document.getElementById('q-question').value.trim();
  if(!question){ alert('請輸入或選擇想問的問題'); return; }
  var name=document.getElementById('q-name').value.trim()||'匿名';

  if(currentMethod==='tarot'){
    doTarotDraw(name, question);
  } else {
    doIchingCast(name, question);
  }
}

// ══════════════════════════════════════════════════════════
// 塔羅抽牌邏輯
// ══════════════════════════════════════════════════════════
function shuffleDeck(){
  var deck=TAROT_FULL.slice();
  for(var i=deck.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=deck[i]; deck[i]=deck[j]; deck[j]=tmp;
  }
  return deck;
}

function doTarotDraw(name, question){
  var spread=SPREADS.find(function(s){return s.id===selectedSpread;})||SPREADS[1];
  var deck=shuffleDeck();
  var drawn=[];
  for(var i=0;i<spread.count;i++){
    var card=deck[i];
    var reversed=Math.random()<0.45;
    drawn.push({card:card, reversed:reversed, position:spread.positions[i]});
  }

  lastResult={type:'tarot', name:name, question:question, spread:spread, cards:drawn, date:new Date().toLocaleDateString('zh-TW')};

  var html='<div class="sec" style="background:linear-gradient(160deg,var(--ink) 0%,var(--tarot) 100%);border-color:var(--gold-lt);">';
  html+='<div class="sec-body" style="color:rgba(255,255,255,.85);font-size:.85rem">';
  html+='<p><strong style="color:var(--gold-lt)">'+name+'</strong>　'+new Date().toLocaleDateString('zh-TW')+'</p>';
  html+='<p style="margin-top:6px">問卜：「'+question+'」</p>';
  html+='<p style="margin-top:4px;font-size:.78rem;color:rgba(255,255,255,.6)">牌陣：'+spread.name+'</p>';
  html+='</div></div>';

  drawn.forEach(function(d,i){
    html+='<div class="tarot-card'+(d.reversed?' reversed':'')+'">';
    html+='<div class="tc-pos">位置 '+(i+1)+'：'+d.position+'</div>';
    html+='<div class="tc-name">'+d.card.name+'</div>';
    html+='<div class="tc-keywords">'+d.card.kw.map(function(k){return '<span class="tc-kw">'+k+'</span>';}).join('')+'</div>';
    html+='<div class="tc-meaning">'+(d.reversed?d.card.rev:d.card.up)+'</div>';
    html+='</div>';
  });

  html+='<div class="sec"><div class="sec-head"><div class="sec-icon">✦</div>整體指引</div><div class="sec-body">';
  html+='<p>'+genTarotSummary(drawn, spread)+'</p>';
  html+='</div></div>';

  document.getElementById('r-title').textContent=name+'的塔羅牌占卜結果';
  document.getElementById('result-content').innerHTML=html;
  document.getElementById('question-input').style.display='none';
  document.getElementById('result-view').style.display='';
  document.getElementById('result-view').scrollIntoView({behavior:'smooth'});
}

function genTarotSummary(drawn, spread){
  var majorCount=drawn.filter(function(d){return TAROT_MAJOR.indexOf(d.card)>=0;}).length;
  var reversedCount=drawn.filter(function(d){return d.reversed;}).length;
  var summary='';
  if(majorCount===drawn.length&&drawn.length>1){
    summary+='這次抽到的牌全部都是大阿爾克那，代表這個問題牽涉到人生中相當重要的課題和轉折，不是日常瑣事層級的問題，值得你認真看待和思考。';
  } else if(majorCount===0){
    summary+='這次抽到的都是小阿爾克那，代表眼前的狀況更多是日常生活層面的具體情境，答案往往藏在細節的行動和選擇裡。';
  } else {
    summary+='這次的牌組合大小阿爾克那都有，代表這個問題既有具體的日常層面，也牽動著更深層的人生課題，兩者互相影響。';
  }
  if(reversedCount>=Math.ceil(drawn.length/2)&&drawn.length>1){
    summary+=' 逆位牌偏多，提醒你現在可能有些內在的阻礙或尚未顯化的能量，事情的發展可能會比預期更需要耐心，也可能有些狀況需要先向內看清楚，才能真正往前走。';
  } else if(reversedCount===0&&drawn.length>1){
    summary+=' 全部都是正位牌，代表能量流動順暢，牌面訊息會相對直接地反映在現實中，是適合積極行動的訊號。';
  }
  return summary;
}

// ══════════════════════════════════════════════════════════
// 易經銅錢卦邏輯
// ══════════════════════════════════════════════════════════
// 三枚銅錢：正面(字)=3，反面=2。三次加總：6=老陰(動)，7=少陽，8=少陰，9=老陽(動)
function tossCoins(){
  var sum=0;
  for(var i=0;i<3;i++){ sum += Math.random()<0.5 ? 3 : 2; }
  return sum; // 6,7,8,9
}

function doIchingCast(name, question){
  var lines=[]; // 由下往上：{value:6/7/8/9, yang:bool, moving:bool}
  for(var i=0;i<6;i++){
    var v=tossCoins();
    var yang=(v===7||v===9);
    var moving=(v===6||v===9);
    lines.push({value:v, yang:yang, moving:moving});
  }

  // 本卦二進位字串（由下往上）
  var benGuaKey=lines.map(function(l){return l.yang?'1':'0';}).join('');
  // 上卦=後三碼(4,5,6爻)，下卦=前三碼(1,2,3爻)
  var lowerKey=benGuaKey.substring(0,3);
  var upperKey=benGuaKey.substring(3,6);

  var benGua=HEXAGRAM_DATA[benGuaKey]||{name:BAGUA_NAMES[upperKey]+BAGUA_NAMES[lowerKey],judge:'（此卦組合為'+BAGUA_NAMES[upperKey]+'上'+BAGUA_NAMES[lowerKey]+'下，卦辭資料庫尚未完整收錄此卦，請參考上下卦的基本卦德進行解讀。）'};

  // 變卦（動爻陰陽互變）
  var hasMoving=lines.some(function(l){return l.moving;});
  var zhiGuaKey=lines.map(function(l){return l.moving?(l.yang?'0':'1'):(l.yang?'1':'0');}).join('');
  var zhiGua=hasMoving?(HEXAGRAM_DATA[zhiGuaKey]||{name:'（變卦組合尚未收錄）',judge:''}):null;

  lastResult={type:'iching', name:name, question:question, lines:lines, benGua:benGua, zhiGua:zhiGua, hasMoving:hasMoving, date:new Date().toLocaleDateString('zh-TW')};

  var html='<div class="sec" style="background:linear-gradient(160deg,var(--ink) 0%,var(--iching) 100%);border-color:var(--gold-lt);">';
  html+='<div class="sec-body" style="color:rgba(255,255,255,.85);font-size:.85rem">';
  html+='<p><strong style="color:var(--gold-lt)">'+name+'</strong>　'+new Date().toLocaleDateString('zh-TW')+'</p>';
  html+='<p style="margin-top:6px">問卜：「'+question+'」</p>';
  html+='</div></div>';

  html+='<div class="sec"><div class="sec-head"><div class="sec-icon">☯</div>本卦：'+benGua.name+'</div><div class="sec-body">';
  html+='<div class="hexagram-lines">';
  for(var i=5;i>=0;i--){
    var l=lines[i];
    html+='<div class="yao-line">';
    html+='<div class="yao-label">第'+(i+1)+'爻'+(l.moving?' <span class="yao-moving">●動</span>':'')+'</div>';
    html+='<div class="yao-visual">';
    if(l.yang){ html+='<div class="bar" style="width:100px;left:0"></div>'; }
    else { html+='<div class="bar left" style="width:44px"></div><div class="bar right" style="width:44px"></div>'; }
    html+='</div>';
    html+='</div>';
  }
  html+='</div>';
  html+='<p style="margin-top:10px"><span class="hl">卦辭：</span>'+benGua.judge+'</p>';
  html+='</div></div>';

  if(hasMoving&&zhiGua){
    html+='<div class="sec"><div class="sec-head"><div class="sec-icon">➜</div>變卦：'+zhiGua.name+'</div><div class="sec-body">';
    html+='<p style="font-size:.82rem;color:var(--mist);margin-bottom:8px">動爻代表事情正在變化中，本卦看現況，變卦看未來的發展趨勢。</p>';
    html+='<p>'+zhiGua.judge+'</p>';
    html+='</div></div>';
  } else {
    html+='<div class="sec"><div class="sec-body"><p style="font-size:.85rem;color:var(--mist)">這次沒有動爻，代表事情目前處於相對穩定的狀態，本卦的卦辭就是完整的答案，不會有進一步的變化趨勢。</p></div></div>';
  }

  html+='<div class="tip">易經卦象給的是「勢」的判斷——目前情況的趨勢和道理，不是絕對的吉凶預言。真正的智慧在於看懂這個「勢」之後，你選擇怎麼順勢而為或修正調整。</div>';

  document.getElementById('r-title').textContent=name+'的易經卦象結果';
  document.getElementById('result-content').innerHTML=html;
  document.getElementById('question-input').style.display='none';
  document.getElementById('result-view').style.display='';
  document.getElementById('result-view').scrollIntoView({behavior:'smooth'});
}

function copyText(t){if(!t||!t.trim()){alert('尚無結果');return;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){alert('已複製！');}).catch(function(){fbCopy(t);});}else{fbCopy(t);}}
function fbCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');alert('已複製！');}catch(e){alert('請手動複製');}document.body.removeChild(ta);}
function copyResult(){
  var el=document.getElementById('result-content');
  if(!el) return;
  copyText((el.innerText||el.textContent).trim());
}

function goNav(view, el){

    a.classList.remove('on');

    a.style.borderBottomColor='transparent';
  });
  el.classList.add('on');
  el.style.color='var(--gold)';
  el.style.borderBottomColor='var(--gold)';
  document.getElementById('divine-view').style.display = view==='divine' ? '' : 'none';
  document.getElementById('crm-view').style.display = view==='crm' ? '' : 'none';
  if(view==='crm') renderClients();
}

// ══════════════════════════════════════════════════════════
// CRM（與其他命盤系統共用同一份 localStorage 客戶資料）
// ══════════════════════════════════════════════════════════
var clients=JSON.parse(localStorage.getItem('mp_clients')||'[]');
var editIdx=-1;

function renderClients(){
  var el=document.getElementById('client-list');
  if(!clients.length){
    el.innerHTML='<div style="text-align:center;padding:40px;color:var(--mist);font-size:.88rem;">尚未新增任何客戶</div>';
    return;
  }
  el.innerHTML='';
  clients.forEach(function(c,i){
    var div=document.createElement('div');
    div.style.cssText='background:var(--card);border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;';
    div.innerHTML='<div><h3 style="font-size:.92rem;font-weight:700;margin-bottom:4px;">'+c.name+'</h3>'+
      '<p style="font-size:.78rem;color:var(--mist);line-height:1.6;">'+(c.phone||'')+(c.note?' ｜ '+c.note:'')+'</p></div>'+
      '<div style="display:flex;gap:6px;flex-shrink:0;">'+
      '<button onclick="loadClientToDivine('+i+')" style="padding:6px 12px;border:1px solid var(--tarot);border-radius:3px;font-size:.75rem;cursor:pointer;background:var(--tarot);color:#fff;">占卜</button>'+
      '<button onclick="editClient('+i+')" style="padding:6px 12px;border:1px solid var(--border);border-radius:3px;font-size:.75rem;cursor:pointer;background:var(--bg);">編輯</button>'+
      '<button onclick="delClient('+i+')" style="padding:6px 12px;border:1px solid var(--border);border-radius:3px;font-size:.75rem;cursor:pointer;background:var(--bg);">刪除</button>'+
      '</div>';
    el.appendChild(div);
  });
}
function openAddClient(){
  editIdx=-1;
  document.getElementById('modal-title').textContent='新增客戶';
  ['c-name','c-phone','c-year','c-note'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('client-modal').style.display='flex';
}
function editClient(i){
  editIdx=i;
  var c=clients[i];
  document.getElementById('modal-title').textContent='編輯客戶';
  document.getElementById('c-name').value=c.name||'';
  document.getElementById('c-phone').value=c.phone||'';
  document.getElementById('c-year').value=c.year||'';
  document.getElementById('c-note').value=c.note||'';
  document.getElementById('client-modal').style.display='flex';
}
function closeModal(){ document.getElementById('client-modal').style.display='none'; }
function saveClient(){
  var c={
    name:document.getElementById('c-name').value.trim(),
    phone:document.getElementById('c-phone').value.trim(),
    year:document.getElementById('c-year').value.trim(),
    note:document.getElementById('c-note').value.trim()
  };
  if(!c.name){alert('請輸入姓名');return;}
  if(editIdx>=0){ c=Object.assign({},clients[editIdx],c); clients[editIdx]=c; }
  else clients.push(c);
  localStorage.setItem('mp_clients',JSON.stringify(clients));
  closeModal();
  renderClients();
}
function delClient(i){
  if(!confirm('確定刪除「'+clients[i].name+'」？')) return;
  clients.splice(i,1);
  localStorage.setItem('mp_clients',JSON.stringify(clients));
  renderClients();
}
function loadClientToDivine(i){
  var c=clients[i];
  goNav('divine', document.querySelectorAll('.nav-a')[0]);
  document.getElementById('q-name').value=c.name||'';
  window.scrollTo(0,0);
}
</script>
</body>
